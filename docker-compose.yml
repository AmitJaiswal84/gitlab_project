services:

  nodejs-app:
    image: nodejs-app:latest
    container_name: nodejs-app
    restart: unless-stopped

    expose:
      - "3000"

    networks:
      - app-network


  nginx:
    image: nginx:alpine
    container_name: nodejs-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - nodejs-app

    networks:
      - app-network


networks:
  app-network:
    driver: bridge
