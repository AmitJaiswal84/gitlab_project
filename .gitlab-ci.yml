stages:
  - build
  - deploy


variables:
  IMAGE_NAME: "nodejs-app"


# ==========================================
# Build Docker Image
# ==========================================
build:
  stage: build

  script:
    - echo "Building Docker image..."

    - docker build -t $IMAGE_NAME:latest .

    - echo "Saving Docker image..."

    - docker save $IMAGE_NAME:latest | gzip > nodejs-app.tar.gz

  artifacts:
    paths:
      - nodejs-app.tar.gz
    expire_in: 1 hour

  only:
    - main


# ==========================================
# Deploy to Server
# ==========================================
deploy:
  stage: deploy

  before_script:
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

  script:

    - echo "Copying Docker image to server..."

    - scp nodejs-app.tar.gz \
        $SERVER_USER@$SERVER_HOST:/opt/nodejs-app/


    - echo "Deploying application..."

    - |
      ssh $SERVER_USER@$SERVER_HOST << 'EOF'

      set -e

      cd /opt/nodejs-app

      echo "Loading Docker image..."

      docker load < nodejs-app.tar.gz

      echo "Stopping old containers..."

      docker compose down

      echo "Starting new containers..."

      docker compose up -d

      echo "Removing temporary image file..."

      rm -f nodejs-app.tar.gz

      echo "Removing unused Docker images..."

      docker image prune -f

      echo "Deployment completed."

      docker compose ps

      EOF

  only:
    - main
